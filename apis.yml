aid: fxlabs
name: APIsec
description: >-
  APIsec (listed as "Fxlabs" in Canaan Partners' portfolio directory, which
  resolves to apisec.ai) is an AI-powered API and application security platform
  that delivers continuous, automated security testing across the full API
  lifecycle. Rather than only flagging potential issues, APIsec combines threat
  modeling, attack-surface mapping, and AI-driven exploit validation to prove
  which vulnerabilities are actually exploitable at runtime — producing
  replayable evidence and remediation guidance. Its products span the APIsec
  Platform (continuous scanning and OWASP API Top 10 coverage), apisec Surface
  (open-source mapping of APIs, endpoints, and AI connections), and a large
  practitioner community through APIsec University (150,000+ practitioners) and
  Discord (15,000+ members). The company also publishes open-source security
  tooling and Agent Skills that embed OWASP API Security Top 10 intelligence
  directly into AI coding agents such as Cursor, Claude Code, and Copilot.
